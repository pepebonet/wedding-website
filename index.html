      <div class="text-center reveal">
        <p class="kicker !text-gold" data-i18n="rsvp.kicker"></p>

        <span class="rule mx-auto"></span>
        <p class="mt-4 text-ivory/85"><span data-i18n="rsvp.intro"></span></p>
      </div>

      <form id="rsvpForm" class="mt-10 space-y-5 reveal" novalidate>
        <div>
          <label class="lbl" for="f_name" data-i18n="rsvp.f_name"></label>
          <input id="f_name" name="name" type="text" required class="inp" data-i18n-ph-attr="rsvp.f_name_ph" />
        </div>
        <div>
          <label class="lbl" for="f_email" data-i18n="rsvp.f_email"></label>
          <input id="f_email" name="email" type="email" class="inp" placeholder="you@email.com" />
        </div>

        <div>
          <span class="lbl" data-i18n="rsvp.f_attending"></span>
          <div class="grid grid-cols-2 gap-3">
            <label class="radio-card"><input type="radio" name="attending" value="yes" required class="peer sr-only" /><span class="radio-face" data-i18n="rsvp.a_yes"></span></label>
            <label class="radio-card"><input type="radio" name="attending" value="no" class="peer sr-only" /><span class="radio-face" data-i18n="rsvp.a_no"></span></label>
          </div>
        </div>

        <!-- fields shown only when attending = yes -->
        <div id="ifYes" class="space-y-5 hidden">
          <div>
            <label class="lbl" for="f_party" data-i18n="rsvp.f_party"></label>
            <input id="f_party" name="party" type="number" min="1" value="1" inputmode="numeric" class="inp" />
          </div>

          <div>
            <label class="lbl" for="f_diet" data-i18n="rsvp.f_diet"></label>
            <textarea id="f_diet" name="dietary" rows="2" class="inp" data-i18n-ph-attr="rsvp.f_diet_ph"></textarea>
            <p class="help" data-i18n="rsvp.f_diet_help"></p>
          </div>

          <div>
            <span class="lbl" data-i18n="rsvp.f_events"></span>
            <div class="space-y-2">
              <label class="check-row"><input type="checkbox" name="events" value="wedding" checked /><span data-i18n="rsvp.e_wedding"></span></label>
              <label class="check-row"><input type="checkbox" name="events" value="dayafter" /><span data-i18n="rsvp.e_dayafter"></span></label>
            </div>
          </div>

          <div class="grid sm:grid-cols-2 gap-4">
            <div>
              <span class="lbl" data-i18n="rsvp.f_olympia"></span>
              <div class="grid grid-cols-2 gap-2">
                <label class="radio-card sm"><input type="radio" name="olympia" value="yes" class="peer sr-only" checked /><span class="radio-face" data-i18n="rsvp.yes"></span></label>
                <label class="radio-card sm"><input type="radio" name="olympia" value="no" class="peer sr-only" /><span class="radio-face" data-i18n="rsvp.no"></span></label>
              </div>
            </div>
            <div>
              <span class="lbl" data-i18n="rsvp.f_bus"></span>
              <div class="grid grid-cols-2 gap-2">
                <label class="radio-card sm"><input type="radio" name="bus" value="yes" class="peer sr-only" checked /><span class="radio-face" data-i18n="rsvp.yes"></span></label>
                <label class="radio-card sm"><input type="radio" name="bus" value="no" class="peer sr-only" /><span class="radio-face" data-i18n="rsvp.no"></span></label>
              </div>
            </div>
          </div>

          <div>
            <span class="lbl" data-i18n="rsvp.f_return"></span>
            <div class="grid grid-cols-2 gap-3">
              <label class="radio-card sm"><input type="radio" name="returnBus" value="early" class="peer sr-only" /><span class="radio-face" data-i18n="rsvp.r_early"></span></label>
              <label class="radio-card sm"><input type="radio" name="returnBus" value="late" class="peer sr-only" checked /><span class="radio-face" data-i18n="rsvp.r_late"></span></label>
            </div>
          </div>

          <div>
            <label class="lbl" for="f_song" data-i18n="rsvp.f_song"></label>
            <input id="f_song" name="song" type="text" class="inp" data-i18n-ph-attr="rsvp.f_song_ph" />
          </div>
        </div>

        <div>
          <label class="lbl" for="f_message" data-i18n="rsvp.f_message"></label>
          <textarea id="f_message" name="message" rows="3" class="inp"></textarea>
        </div>

        <button type="submit" id="rsvpSubmit" class="w-full min-h-[52px] rounded-full bg-gold px-6 py-3.5 font-semibold uppercase tracking-wider text-green hover:bg-goldD transition-colors disabled:opacity-60" data-i18n="rsvp.submit"></button>

        <p id="rsvpMsg" class="hidden text-center font-medium rounded-lg px-4 py-3"></p>
        <p id="rsvpDemoNote" class="help !text-ivory/55 text-center" data-i18n="rsvp.demoNote"></p>
      </form>
    </div>
  </section>

  <!-- ============================== GIFTS ============================ -->
  <section id="gifts" class="py-20 sm:py-28 px-6 bg-sand">
    <div class="max-w-xl mx-auto text-center reveal">
      <p class="kicker" data-i18n="gifts.kicker"></p>
      <h2 class="h2" data-i18n="gifts.title"></h2>
      <span class="rule mx-auto"></span>
      <p class="mt-5" data-i18n="gifts.body"></p>

      <div class="mt-8 rounded-2xl bg-green text-ivory p-6 text-left">
        <p class="text-[0.7rem] uppercase tracking-widest text-gold" data-i18n="gifts.holderLabel"></p>
        <p class="font-display text-2xl mb-4"><span data-i18n="gifts.holder"></span></p>
        <p class="text-[0.7rem] uppercase tracking-widest text-gold" data-i18n="gifts.ibanLabel"></p>
        <div class="flex flex-col sm:flex-row sm:items-center gap-3 mt-1">
          <code id="ibanVal" class="font-mono text-lg tracking-wide flex-1 break-all"></code>
          <button id="ibanCopy" class="shrink-0 min-h-[44px] rounded-full bg-gold px-5 py-2 text-sm font-semibold text-green hover:bg-goldD transition-colors" data-i18n="gifts.copy"></button>
        </div>
      </div>
      <p class="text-sm text-ink/70 mt-5" data-i18n="gifts.sobre"></p>
    </div>
  </section>

  <!-- ========================== GOOD TO KNOW ========================= -->
  <section id="gtk" class="py-20 sm:py-28 px-6">
    <div class="max-w-4xl mx-auto">
      <div class="text-center reveal">
        <p class="kicker" data-i18n="gtk.kicker"></p>
        <h2 class="h2" data-i18n="gtk.title"></h2>
        <span class="rule mx-auto"></span>
      </div>
      <div id="gtkGrid" class="mt-12 grid sm:grid-cols-2 lg:grid-cols-3 gap-5 reveal"></div>
    </div>
  </section>

  <!-- ============================== FAQ ============================== -->
  <section id="faq" class="py-20 sm:py-28 px-6 bg-sand">
    <div class="max-w-2xl mx-auto">
      <div class="text-center reveal">
        <p class="kicker" data-i18n="faq.kicker"></p>
        <h2 class="h2" data-i18n="faq.title"></h2>
        <span class="rule mx-auto"></span>
      </div>
      <div id="faqList" class="mt-10 reveal"></div>
    </div>
  </section>

  <!-- ============================= PHOTOS ============================ -->
  <section id="photos" class="py-20 sm:py-28 px-6">
    <div class="max-w-5xl mx-auto">
      <div class="text-center reveal max-w-2xl mx-auto">
        <p class="kicker" data-i18n="photos.kicker"></p>
        <h2 class="h2" data-i18n="photos.title"></h2>
        <span class="rule mx-auto"></span>
        <p class="lead mt-4" data-i18n="photos.body"></p>
      </div>
      <div id="gallery" class="mt-10 grid grid-cols-2 sm:grid-cols-3 gap-3 reveal"></div>
      <p class="note mt-8 reveal max-w-xl mx-auto"><span data-i18n="photos.share"></span></p>
    </div>
  </section>

  <!-- ============================= FOOTER ============================ -->
  <footer class="bg-green text-ivory/80 py-14 px-6 text-center">
    <p class="font-script text-5xl text-ivory">Evi <span class="text-gold">&amp;</span> Pepe</p>
    <p class="mt-3 text-sm tracking-wide" data-i18n="footer.date"></p>
    <p class="mt-4 text-sm text-ivory/60" data-i18n="footer.madeWith"></p>
    <div class="lang-switch inline-flex items-center rounded-full border border-ivory/25 overflow-hidden text-xs font-semibold mt-6">
      <button data-lang="en" class="lang-btn">EN</button>
      <button data-lang="es" class="lang-btn">ES</button>
      <button data-lang="de" class="lang-btn">DE</button>
    </div>
  </footer>

  <!-- lightbox -->
  <div id="lightbox" class="fixed inset-0 z-[60] hidden items-center justify-center bg-green/95 p-4">
    <button id="lbClose" class="absolute top-3 right-4 w-11 h-11 text-ivory text-4xl leading-none">&times;</button>
    <img id="lbImg" src="" alt="" class="max-h-[88vh] max-w-[92vw] rounded-lg object-contain" />
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
